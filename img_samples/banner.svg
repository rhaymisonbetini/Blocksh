<svg width="900" height="150" viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="neon-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur-wide"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"  result="blur-tight"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"  result="blur-sharp"/>
      <feMerge>
        <feMergeNode in="blur-wide"/>
        <feMergeNode in="blur-tight"/>
        <feMergeNode in="blur-sharp"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="neon-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow-line" x="-10%" y="-200%" width="120%" height="500%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#07080f"/>
      <stop offset="30%"  stop-color="#0d0f1a"/>
      <stop offset="70%"  stop-color="#0d0f1a"/>
      <stop offset="100%" stop-color="#07080f"/>
    </linearGradient>
    <linearGradient id="line-gradient" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#89b4fa" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#89b4fa" stop-opacity="0.8"/>
      <stop offset="50%"  stop-color="#89b4fa" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#89b4fa" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line-gradient-bottom" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#94e2d5" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#94e2d5" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#94e2d5" stop-opacity="0.9"/>
      <stop offset="80%"  stop-color="#94e2d5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#94e2d5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="150" fill="url(#bg-gradient)" rx="10"/>

  <!-- Top accent line (neon blue) -->
  <line x1="0" y1="2" x2="900" y2="2" stroke="url(#line-gradient)" stroke-width="2" filter="url(#glow-line)"/>

  <!-- Bottom accent line (neon cyan) -->
  <line x1="0" y1="148" x2="900" y2="148" stroke="url(#line-gradient-bottom)" stroke-width="1.5" filter="url(#glow-line)"/>

  <!-- Decorative corner brackets -->
  <path d="M 16 16 L 16 28 M 16 16 L 28 16" stroke="#89b4fa" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 884 16 L 884 28 M 884 16 L 872 16" stroke="#89b4fa" stroke-width="1.5" fill="none" opacity="0.5"/>
  <path d="M 16 134 L 16 122 M 16 134 L 28 134" stroke="#94e2d5" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M 884 134 L 884 122 M 884 134 L 872 134" stroke="#94e2d5" stroke-width="1.5" fill="none" opacity="0.4"/>

  <!-- Cursor blink indicator -->
  <rect x="68" y="52" width="4" height="42" fill="#89b4fa" opacity="0.9" filter="url(#neon-cyan)"/>

  <!-- Main title: >_ Blocksh -->
  <text
    x="450" y="88"
    font-family="'Courier New', Courier, monospace"
    font-size="58"
    font-weight="bold"
    fill="#89b4fa"
    text-anchor="middle"
    filter="url(#neon-blue)"
  >&gt;_ Blocksh</text>

  <!-- Subtitle -->
  <text
    x="450" y="122"
    font-family="'Courier New', Courier, monospace"
    font-size="11"
    fill="#94e2d5"
    text-anchor="middle"
    letter-spacing="5"
    filter="url(#neon-cyan)"
  >AI-AUGMENTED TERMINAL  ·  ENGINEERED FOR THE COMMAND LINE ERA</text>
</svg>
